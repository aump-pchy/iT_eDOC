# ============================================================
# docker-compose.yml
# iT-e-Document — Self-Hosted Stack (Production / Server)
#
# Services:
#   postgres — Database (port 5432)
#   minio    — S3-compatible file storage (port 9000-9001)
#   backend  — Express API (port 3000)
#   frontend — Vue + Vite (built static via nginx)
#   nginx    — Reverse proxy (port 80)
#
# หมายเหตุ: ค่าที่ขึ้นต้นด้วย ${...} ต้องตั้งใน Environment
# variables ตอนสร้าง Stack บน Portainer (ดูรายการท้ายไฟล์)
# ============================================================

version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: itedoc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: itedoc
      POSTGRES_USER: itedoc
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # ปิดการเปิด port ออก LAN โดย default — backend เข้าถึงผ่าน internal network พอ
    # ถ้าจำเป็นต้องต่อจากเครื่องอื่นจริงๆ ค่อยเปิดคอมเมนต์บรรทัดล่าง
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itedoc -d itedoc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - itedoc_net

  # ── MinIO (S3-compatible Storage) ───────────────────────────
  minio:
    image: minio/minio:latest
    container_name: itedoc_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - itedoc_net

  # ── Backend (Express Server) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itedoc_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      FRONTEND_URL: http://${SERVER_HOST}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: itedoc
      DB_USER: itedoc
      DB_PASSWORD: ${DB_PASSWORD}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: memos-pdf
      MINIO_PUBLIC_HOST: ${SERVER_HOST}
      MINIO_PUBLIC_PORT: 9000

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - itedoc_net

  # ── Frontend (Vue Build & Static Nginx) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itedoc_frontend
    restart: unless-stopped
    networks:
      - itedoc_net

  # ── Nginx Gateway (Port 80) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: itedoc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - itedoc_net

# ── Volumes & Networks ───────────────────────────────────────
volumes:
  postgres_data:
  minio_data:

networks:
  itedoc_net:
    driver: bridge

# ============================================================
# Environment variables ที่ต้องตั้งใน Portainer → Stacks →
# Add stack → Environment variables (ก่อนกด Deploy):
#
#   SERVER_HOST       = 192.168.10.201
#   DB_PASSWORD        = <ตั้งรหัสใหม่ ไม่ใช้ "secret">
#   MINIO_ACCESS_KEY  = <ตั้งค่าใหม่ ไม่ใช้ "minioadmin">
#   MINIO_SECRET_KEY  = <ตั้งค่าใหม่ ไม่ใช้ "minioadmin">
#   JWT_SECRET        = iT-e-DOC@LoeiTech#2569!SecretKey
# ============================================================