# ============================================================
# nginx/nginx.conf
# Reverse Proxy หลัก — จุดเข้าเดียวของทุก request
#
# Routes:
#   /api/*        → backend (Express)  port 3000
#   /              → frontend (Vue)     port 80
# ============================================================

events {
    worker_connections 1024;
}

http {
    # ── Upstream servers ─────────────────────────────────────
    upstream backend {
        server backend:3000;
    }

    upstream frontend {
        server frontend:80;
    }

    # ── Server Block ─────────────────────────────────────────
    server {
        listen 80;
        server_name localhost 192.168.10.201;

        # เพิ่มขนาด upload สูงสุด (สำหรับไฟล์ PDF)
        client_max_body_size 50M;

        # ── API Routes → Express Backend ─────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # Headers สำหรับ WebSocket / Keep-Alive
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # ส่ง headers ต้นทางไปด้วย
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
        }

        # ── Route MinIO PDF Files ─────────────────────────────
        location /memos-pdf/ {
            proxy_pass         http://minio:9000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Everything else → Vue Frontend ───────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
