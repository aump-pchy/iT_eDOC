# ============================================================
# frontend/nginx.frontend.conf
# Nginx config สำหรับ Vue SPA (รองรับ history mode routing)
# ============================================================

server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # กำหนด charset
    charset utf-8;

    # Vue Router history mode: ถ้าไม่มีไฟล์จริง ให้ส่ง index.html กลับไป
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache ไฟล์ static (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ไม่ cache index.html (ให้ได้ version ล่าสุดเสมอ)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
